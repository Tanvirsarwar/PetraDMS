name: CI

# Every push to main and every pull request: the full test gate on Ubuntu, then the Windows installer is built and
# verified and kept as the artifact "PetraDMS-Windows-x64" (Actions, this run, Artifacts).
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/checks.yml
  windows:
    needs: checks
    name: Windows
    uses: ./.github/workflows/windows-build.yml
    secrets: inherit
